<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Picaso</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="checkout.css">
</head>

<body>
    <!-- Include your header/nav here -->
    <!-- ========== NAVBAR ========== -->
    <header class="navbar" id="navbar">
        <div class="container nav-inner">
            <a href="index.html" class="brand" aria-label="Picaso home">
                <img src="/public/icons/brand_logo.svg" alt="Picaso logo" class="brand-icon" />
                <span class="brand-name">Picaso</span>
            </a>

            <nav class="nav-links" id="navLinks" aria-label="Main navigation">
                <a href="index.html" class="active">Home</a>
                <a href="shop.html">Shop</a>
                <a href="#contact">Contact Us</a>
                <a href="#about">About</a>
            </nav>

            <div class="nav-actions">
                <button class="icon-btn" id="cartOpen" aria-label="Open cart">
                    <img src="/public/icons/cart.svg" alt="" />
                    <span class="cart-badge" id="cartBadge">0</span>
                </button>
                <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Toggle menu" aria-expanded="false">
                    <img src="/public/icons/menu.svg" alt="" />
                </button>
            </div>
        </div>
    </header>

    <main class="checkout-container">
        <h1 class="checkout-title">Checkout</h1>

        <div class="checkout-grid">
            <!-- Left Side: Form -->
            <div class="checkout-form-section">
                <h2>Delivery Information</h2>
                <form id="checkoutForm" class="checkout-form">
                    <div class="form-group">
                        <label for="customerName">Full Name *</label>
                        <input type="text" id="customerName" name="name" required autocomplete="name">
                        <span class="error" data-for="name"></span>
                    </div>

                    <div class="form-group">
                        <label for="customerPhone">Phone Number *</label>
                        <input type="tel" id="customerPhone" name="phone" required autocomplete="tel"
                            placeholder="01XXXXXXXXX">
                        <span class="error" data-for="phone"></span>
                    </div>

                    <div class="form-group">
                        <label for="customerAddress">Delivery Address *</label>
                        <textarea id="customerAddress" name="address" rows="4" required autocomplete="street-address"
                            placeholder="House no, Road no, Area, City"></textarea>
                        <span class="error" data-for="address"></span>
                    </div>

                    <div class="form-group">
                        <label for="orderNote">Order Note (Optional)</label>
                        <textarea id="orderNote" name="note" rows="2"
                            placeholder="Any special instructions?"></textarea>
                    </div>
                </form>
            </div>

            <!-- Right Side: Order Summary -->
            <div class="checkout-summary-section">
                <h2>Order Summary</h2>
                <div id="orderSummary" class="order-summary">
                    <!-- Items will be rendered here by JS -->
                </div>

                <div class="order-totals">
                    <div class="total-row">
                        <span>Subtotal</span>
                        <span id="subtotal">৳ 0</span>
                    </div>
                    <div class="total-row">
                        <span>Delivery Charge</span>
                        <span id="deliveryCharge">৳ 60</span>
                    </div>
                    <div class="total-row total-final">
                        <span>Total</span>
                        <span id="totalAmount">৳ 0</span>
                    </div>
                </div>

                <button type="button" id="confirmOrderBtn" class="confirm-btn">
                    Confirm Order
                </button>
            </div>
        </div>
    </main>

    <!-- Include your footer here -->
    <footer>
        <p>&copy; <span id="year"></span> Picaso. All rights reserved.</p>
    </footer>

    <!-- ========== CART DRAWER ========== -->
    <div class="overlay" id="overlay"></div>
    <aside class="cart-drawer" id="cartDrawer" aria-label="Shopping cart" aria-hidden="true">
        <div class="cart-head">
            <h3>Your Cart</h3>
            <button class="icon-btn" id="cartClose" aria-label="Close cart">
                <img src="/public/icons/close.svg" alt="" />
            </button>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-foot">
            <div class="cart-total"><span>Subtotal</span><strong id="cartTotal">৳ 0</strong></div>
            <a href="shop.html" class="btn btn-outline full">Continue Shopping</a>
            <button class="btn btn-gold full" id="checkoutBtn">Checkout</button>
        </div>
    </aside>

    <script src="product.js"></script>
    <script src="script.js"></script>
    <script src="checkout.js"></script>
</body>

</html>
