<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shop | Picaso</title>
    <meta name="description" content="Shop Kirkland Signature Minoxidil 5% Topical Solution at Picaso.">
    <link rel="icon" href="/public/icons/favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="shop.css">
</head>

<body>

    <!-- ===== PASTE the <header> navbar from index.html here ===== -->
    <!-- Change its links: Home -> index.html, About -> index.html#about,
       Contact Us -> index.html#contact, Shop -> shop.html (mark it active) -->
    <header class="navbar" id="navbar">
        <div class="container nav-inner">
            <a href="index.html" class="brand" aria-label="Picaso home">
                <img src="/public/icons/brand_logo.svg" alt="Picaso logo" class="brand-icon" />
                <span class="brand-name">Picaso</span>
            </a>

            <nav class="nav-links" id="navLinks" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="shop.html" class="active">Shop</a>
                <a href="index.html#contact">Contact Us</a>
                <a href="index.html#about">About</a>
            </nav>

            <div class="nav-actions">
                <button class="icon-btn" id="cartOpen" aria-label="Open cart">
                    <img src="/public/icons/cart.svg" alt="" />
                    <span class="cart-badge" id="cartBadge">0</span>
                </button>
                <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Toggle menu" aria-expanded="false">
                    <img src="/public/icons/menu.svg" alt="" />
                </button>
            </div>
        </div>
    </header>

    <main>
        <section class="page-hero">
            <div class="shop-container">
                <h1>Our Products</h1>
                <p>Genuine products, delivered to your door.</p>
            </div>
        </section>

        <section class="shop-section">
            <div class="shop-container">
                <div class="product-grid" id="productGrid" aria-live="polite"></div>
            </div>
        </section>
    </main>

    <footer class="shop-footer">
        <div class="shop-container">
            <p>&copy; <span id="year"></span> Picaso. All rights reserved.</p>
        </div>
    </footer>

    <!-- ===== PASTE the cart drawer + overlay markup from index.html here ===== -->
    <!-- ========== CART DRAWER ========== -->
    <div class="overlay" id="overlay"></div>
    <aside class="cart-drawer" id="cartDrawer" aria-label="Shopping cart" aria-hidden="true">
        <div class="cart-head">
            <h3>Your Cart</h3>
            <button class="icon-btn" id="cartClose" aria-label="Close cart">
                <img src="/public/icons/close.svg" alt="" />
            </button>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-foot">
            <div class="cart-total"><span>Subtotal</span><strong id="cartTotal">৳ 0</strong></div>
            <a href="shop.html" class="btn btn-outline full">Continue Shopping</a>
            <button class="btn btn-gold full" id="checkoutBtn">Checkout</button>
        </div>
    </aside>


    <script src="product.js"></script>
    <script src="shop.js"></script>
    <script src="script.js"></script>
</body>

</html>
