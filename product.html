<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product | Picaso</title>
    <link rel="icon" href="/public/icons/favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="shop.css">
</head>

<body>

    <!-- ===== PASTE the <header> navbar from index.html here (same changes as shop.html) ===== -->
    <header class="navbar" id="navbar">
        <div class="container nav-inner">
            <a href="index.html" class="brand" aria-label="Picaso home">
                <img src="/public/icons/brand_logo.svg" alt="Picaso logo" class="brand-icon" />
                <span class="brand-name">Picaso</span>
            </a>

            <nav class="nav-links" id="navLinks" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="#contact">Contact Us</a>
                <a href="#about">About</a>
            </nav>

            <div class="nav-actions">
                <button class="icon-btn" id="cartOpen" aria-label="Open cart">
                    <img src="/public/icons/cart.svg" alt="" />
                    <span class="cart-badge" id="cartBadge">0</span>
                </button>
                <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Toggle menu" aria-expanded="false">
                    <img src="/public/icons/menu.svg" alt="" />
                </button>
            </div>
        </div>
    </header>


    <main class="product-page">
        <div class="shop-container">

            <nav class="breadcrumb" aria-label="Breadcrumb">
                <a href="index.html">Home</a> <span>/</span>
                <a href="shop.html">Shop</a> <span>/</span>
                <span id="crumbName">Product</span>
            </nav>

            <!-- Shown when the product id in the URL doesn't exist -->
            <div class="not-found" id="notFound" hidden>
                <h1>Product not found</h1>
                <p>Sorry, we couldn't find that product.</p>
                <a class="sp-btn sp-btn--primary" href="shop.html">Back to shop</a>
            </div>

            <div id="productView">

                <!-- Gallery + purchase info -->
                <section class="product-layout">
                    <div class="gallery">
                        <div class="gallery__thumbs" id="thumbs"></div>
                        <div class="gallery__main">
                            <img id="mainImage" src="public/images/product_image.webp" alt="">
                        </div>
                    </div>

                    <div class="product-info">
                        <h1 id="productName"></h1>
                        <p class="product-info__size" id="productSize"></p>
                        <div class="product-info__rating">
                            <span class="stars" id="topStars" aria-hidden="true"></span>
                            <a href="#reviews" id="topRatingText"></a>
                        </div>
                        <p class="product-info__price" id="productPrice"></p>

                        <div class="qty-row">
                            <label for="qtyInput">Quantity</label>
                            <div class="qty">
                                <button type="button" id="qtyMinus" aria-label="Decrease quantity">&minus;</button>
                                <input type="number" id="qtyInput" value="1" min="1" max="99" inputmode="numeric">
                                <button type="button" id="qtyPlus" aria-label="Increase quantity">+</button>
                            </div>
                        </div>

                        <div class="product-info__actions">
                            <button type="button" class="sp-btn sp-btn--outline" id="addToCartBtn">
                                <img src="/public/icons/cart.svg" alt="" width="18" height="18"> Add to Cart
                            </button>
                            <button type="button" class="sp-btn sp-btn--primary" id="buyNowBtn">Buy Now</button>
                        </div>
                    </div>
                </section>

                <!-- Description -->
                <section class="info-section" id="description">
                    <h2>Description</h2>
                    <div id="descriptionBody"></div>
                </section>

                <!-- Reviews -->
                <section class="info-section" id="reviews">
                    <h2>Customer Reviews</h2>

                    <div class="review-summary">
                        <div class="review-summary__score" id="avgRating">0.0</div>
                        <div>
                            <div class="stars stars--lg" id="avgStars" aria-hidden="true"></div>
                            <p id="reviewCount">No reviews yet</p>
                        </div>
                    </div>

                    <div class="review-layout">
                        <form class="review-form" id="reviewForm" novalidate>
                            <h3>Write a review</h3>

                            <div class="field">
                                <span class="field__label" id="ratingLabel">Your rating</span>
                                <div class="star-picker" id="starPicker" role="radiogroup"
                                    aria-labelledby="ratingLabel">
                                    <button type="button" role="radio" aria-checked="false" data-value="1"
                                        aria-label="1 star">★</button>
                                    <button type="button" role="radio" aria-checked="false" data-value="2"
                                        aria-label="2 stars">★</button>
                                    <button type="button" role="radio" aria-checked="false" data-value="3"
                                        aria-label="3 stars">★</button>
                                    <button type="button" role="radio" aria-checked="false" data-value="4"
                                        aria-label="4 stars">★</button>
                                    <button type="button" role="radio" aria-checked="false" data-value="5"
                                        aria-label="5 stars">★</button>
                                </div>
                            </div>

                            <div class="field">
                                <label for="reviewName">Your name</label>
                                <input type="text" id="reviewName" maxlength="40" autocomplete="name">
                            </div>

                            <div class="field">
                                <label for="reviewText">Your experience</label>
                                <textarea id="reviewText" rows="4" maxlength="600"></textarea>
                            </div>

                            <p class="form-error" id="reviewError" role="alert"></p>
                            <button type="submit" class="sp-btn sp-btn--primary">Submit review</button>
                        </form>

                        <div class="review-list" id="reviewList"></div>
                    </div>
                </section>

            </div>
        </div>
    </main>

    <footer class="shop-footer">
        <div class="shop-container">
            <p>&copy; <span id="year"></span> Picaso. All rights reserved.</p>
        </div>
    </footer>

    <!-- ===== PASTE the cart drawer + overlay markup from index.html here ===== -->
    <!-- ========== CART DRAWER ========== -->
    <div class="overlay" id="overlay"></div>
    <aside class="cart-drawer" id="cartDrawer" aria-label="Shopping cart" aria-hidden="true">
        <div class="cart-head">
            <h3>Your Cart</h3>
            <button class="icon-btn" id="cartClose" aria-label="Close cart">
                <img src="/public/icons/close.svg" alt="" />
            </button>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-foot">
            <div class="cart-total"><span>Subtotal</span><strong id="cartTotal">৳ 0</strong></div>
            <a href="shop.html" class="btn btn-outline full">Continue Shopping</a>
            <button class="btn btn-gold full" id="checkoutBtn">Checkout</button>
        </div>
    </aside>


    <script src="product.js"></script>
    <script src="shop.js"></script>
    <script src="script.js"></script>
</body>

</html>
